<meta charset="utf-8">
<title>研究所求生記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Caveat:wght@600;700&display=swap">
<style>
/* layout: a graph-paper lab notebook — left margin column holds the doodled student, the right page is a desk of sticky notes */
:root{
  color-scheme: light;
  --paper:#fbfcf8;
  --grid:#dde7f0;
  --margin:#ef9f99;
  --ink:#1f2d4a;
  --pencil:#67718a;
  --red:#d3423a;
  --hl:#ffe45c;
  --n-yellow:#fff0a0;
  --n-pink:#ffd4dd;
  --n-green:#d2edcf;
  --n-blue:#d2e3ff;
  --n-orange:#ffdcb8;
  --shadow:rgba(31,45,74,.32);
  --hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti",serif;
  --num:"Caveat","LXGW WenKai TC",cursive;
}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--hand);font-size:17px;line-height:1.6;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
#app{max-width:1120px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}

/* ---------- shared doodle bits ---------- */
.ic{width:72px;height:72px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough);overflow:visible}
.ic text{stroke:none;fill:currentColor;font-family:var(--num);font-weight:700}
.ic.sm{width:30px;height:30px;stroke-width:3.2}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 .15em}
.muted{color:var(--pencil)}
.num{font-family:var(--num);font-weight:700;font-size:1.25em;line-height:1}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}

.btn{
  display:inline-flex;align-items:center;gap:.4em;cursor:pointer;
  background:var(--paper);border:2.5px solid var(--ink);
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  padding:.45em 1.2em;font-size:1.05rem;font-weight:700;
  box-shadow:3px 3px 0 var(--ink);transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--hl)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn:focus-visible,.note:focus-visible,.chip:focus-visible{outline:3px dashed var(--red);outline-offset:4px}

/* sticky notes */
.note{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  background:var(--c,var(--n-yellow));border:none;text-align:left;cursor:pointer;
  padding:22px 16px 16px;min-width:0;
  box-shadow:0 1px 1px rgba(31,45,74,.08),0 10px 16px -10px var(--shadow);
  transform:rotate(var(--r,0deg));transition:transform .2s ease, box-shadow .2s ease;
  animation:deal .45s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:var(--d,0s);
}
.note::before{content:"";position:absolute;top:-9px;left:50%;width:66px;height:20px;
  transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.6);border:1px solid rgba(31,45,74,.07)}
button.note:hover{transform:rotate(0deg) translateY(-7px) scale(1.03);box-shadow:0 2px 2px rgba(31,45,74,.08),0 18px 22px -12px var(--shadow)}
.note h3{font-size:1.3rem}
.note .flav{font-size:.95rem;color:var(--ink);opacity:.85;line-height:1.45}
.note .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px}
.tag{font-size:.78rem;border:1.5px solid currentColor;border-radius:999px;padding:0 8px;color:var(--pencil);white-space:nowrap}
.tag.dice{color:var(--red);border-style:dashed}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px 18px;margin-top:18px}
@keyframes deal{from{opacity:0;transform:translateY(40px) rotate(12deg) scale(.9)}}

.stamp{display:inline-block;font-weight:700;color:var(--red);border:3px solid var(--red);border-radius:6px;
  padding:0 12px;font-size:1.6rem;letter-spacing:.08em;transform:rotate(-10deg);animation:stamp .32s cubic-bezier(.3,1.6,.5,1) backwards;
  mix-blend-mode:multiply;opacity:.92}
.stamp.good{color:#2f7d4a;border-color:#2f7d4a}
@keyframes stamp{from{transform:rotate(-10deg) scale(2.4);opacity:0}}

/* ---------- layout ---------- */
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;margin-bottom:14px}
.brand{font-weight:700;font-size:1.25rem;cursor:pointer;background:none;border:none;padding:0}
.track{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.95rem}
.track .stg{color:var(--pencil)}
.track .stg.now{color:var(--ink);font-weight:700}
.track .stg.done{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.track .arrow{color:var(--pencil)}
#layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
#layout.solo{grid-template-columns:minmax(0,1fr)}
#side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);border-right:2px solid var(--margin);padding-right:20px}
#stage{min-width:0}
#stage.enter{animation:pageIn .4s ease backwards}
@keyframes pageIn{from{opacity:0;transform:translateX(18px) rotate(.6deg)}}

/* character + stats */
.char{width:100%;max-width:210px;display:block;margin:0 auto}
.char .line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.who{text-align:center;font-size:.95rem;margin:2px 0 10px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:4.6em 1fr 2.4em;align-items:center;gap:6px;font-size:.92rem}
.bar .trk{height:14px;border:2px solid var(--ink);border-radius:8px 3px 8px 3px;overflow:hidden;background:var(--paper)}
.bar .fill{height:100%;background:repeating-linear-gradient(-45deg,var(--bc) 0 4px,transparent 4px 7px);border-right:2px solid var(--ink);transition:width .5s ease}
.bar .v{font-family:var(--num);font-weight:700;font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.08);background:var(--hl)}}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.count{border:2px dashed var(--grid);border-radius:6px;padding:2px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:.92rem}
.attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;text-align:center;font-size:.82rem}
.attrs b{display:block;font-family:var(--num);font-size:1.4rem;line-height:1}
.side-sec{margin-top:14px;font-size:.88rem}
.side-sec h4{margin:0 0 4px;font-size:.88rem;color:var(--pencil);letter-spacing:.06em}
.relics{display:flex;flex-wrap:wrap;gap:4px}
.relic{width:38px;height:38px;border:2px solid var(--ink);border-radius:50% 45% 50% 40%;display:grid;place-items:center;background:var(--n-blue);cursor:help}
.profchip{display:flex;align-items:center;gap:8px;background:var(--n-pink);padding:6px 8px;transform:rotate(-1deg)}
.profchip .ic{width:34px;height:34px;flex:none}

/* modal + dice */
.layer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(31,45,74,.38);
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.page{
  position:relative;width:min(560px,100%);max-height:100%;overflow:auto;
  background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,24px 24px,24px 24px;
  padding:26px 24px 22px 66px;box-shadow:0 20px 40px -12px rgba(31,45,74,.5);
  transform:rotate(-.6deg);animation:pop .3s cubic-bezier(.2,1.2,.4,1) backwards;
}
@keyframes pop{from{transform:rotate(-4deg) scale(.85);opacity:0}}
.page .pic{position:absolute;left:4px;top:22px;width:38px;height:38px}
.page h2{font-size:1.5rem;margin-bottom:6px}
.page p{margin:6px 0}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.delta{font-weight:700;border:2px solid currentColor;padding:0 10px;border-radius:12px 4px 12px 4px;font-size:.98rem;background:var(--paper)}
.delta.up{color:#2f7d4a}.delta.down{color:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btns.col{flex-direction:column;align-items:stretch}
.btns.col .btn{justify-content:flex-start;text-align:left}

#dice .box{display:grid;justify-items:center;gap:6px;text-align:center;color:var(--paper);width:min(360px,100%)}
#dice .label{font-size:1.25rem;font-weight:700}
.d20{width:150px;height:150px;fill:var(--paper);stroke:var(--ink);stroke-width:3;stroke-linejoin:round;filter:url(#rough)}
.d20 .inner{fill:var(--n-yellow)}
.d20 text{font-family:var(--num);font-size:40px;font-weight:700;fill:var(--ink);stroke:none}
.d20.spin{animation:spin .9s cubic-bezier(.3,.6,.4,1)}
@keyframes spin{0%{transform:rotate(0) scale(.6)}60%{transform:rotate(600deg) scale(1.1)}100%{transform:rotate(720deg) scale(1)}}
.mods{font-size:.95rem;opacity:.95}
.need{font-size:1.05rem;background:var(--paper);color:var(--ink);padding:0 10px;border-radius:4px}
#dice .stamp{background:var(--paper);font-size:2rem}
.tap{font-size:.8rem;opacity:.7}

/* ---------- scenes ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:center;padding:18px 0 8px}
.cover h1{font-size:clamp(2.6rem,7vw,4.4rem);letter-spacing:.04em;line-height:1.05}
.cover .sub{font-size:1.15rem;margin:10px 0 18px;max-width:30em}
.cover .char{max-width:260px;transform:rotate(-3deg)}
.ruled{border-top:2px dashed var(--grid);margin:28px 0 16px}
.sec-title{font-size:1.25rem;margin-bottom:8px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.howto .note{cursor:default}
.endings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.end{border:2px solid var(--ink);border-radius:10px 3px 10px 3px;padding:8px;text-align:center;background:var(--paper);font-size:.9rem;display:grid;justify-items:center;gap:2px}
.end .ic{width:44px;height:44px}
.end.locked{border-style:dashed;color:var(--pencil);background:transparent}
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.perk{display:grid;gap:4px;border:2px solid var(--ink);padding:10px 12px;background:var(--paper);border-radius:3px 12px 3px 12px;text-align:left;cursor:pointer}
.perk.equip{background:var(--hl)}
.perk.locked{border-style:dashed}
.perk small{color:var(--pencil)}
.scars{font-size:1.05rem}

.scene-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.scene-h h2{font-size:2rem}
.dice6{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:20px;margin-top:20px}
.d6{display:flex;gap:12px;align-items:center}
.d6 .face{width:64px;height:64px;flex:none;border:3px solid var(--ink);border-radius:14px 8px 16px 9px;display:grid;place-items:center;
  font-family:var(--num);font-weight:700;font-size:2.4rem;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.d6 .face.roll{animation:wobble .5s ease}
@keyframes wobble{25%{transform:rotate(-18deg)}50%{transform:rotate(14deg) scale(1.1)}75%{transform:rotate(-6deg)}}
.d6 .note{cursor:default;flex:1}

.form{background:var(--paper);border:2px solid var(--ink);margin-top:16px;overflow-x:auto}
.form table{width:100%;border-collapse:collapse;min-width:520px}
.form th,.form td{border-bottom:1.5px solid var(--grid);padding:8px 10px;text-align:left;vertical-align:middle}
.form th{font-size:.9rem;color:var(--pencil);font-weight:400;background:rgba(221,231,240,.35)}
.form tr.row{cursor:pointer}
.form tr.row:hover td{background:rgba(255,228,92,.25)}
.form .slot{width:2.2em;height:2.2em;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:1.3rem;color:var(--red)}
.form .pct{font-family:var(--num);font-weight:700;font-size:1.3rem}
.form .tier{font-weight:700}
.form .fixed td{color:var(--pencil)}

.results{display:grid;gap:12px;margin-top:18px}
.resrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1.5px dashed var(--grid);padding-bottom:10px;min-height:56px}
.resrow .nm{font-size:1.2rem;font-weight:700;min-width:7em}

.machine{width:min(260px,70vw);display:block;margin:12px auto 0}
.machine.shake{animation:shake .9s ease}
@keyframes shake{10%,50%,90%{transform:rotate(-4deg)}30%,70%{transform:rotate(4deg)}}
.machine .line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.profcard{max-width:380px;margin:18px auto 0;--c:var(--n-pink);cursor:default;align-items:center;text-align:center}
.profcard .ic{width:96px;height:96px}
.rar{font-family:var(--num);font-size:2rem;font-weight:700;line-height:1}
.rar.SSR{color:#c48a00;text-shadow:0 0 12px rgba(255,200,0,.6)}
.rar.SR{color:#7a4cc2}
.rar.R{color:var(--pencil)}
.quote{font-size:1.1rem;font-weight:700}
.center{text-align:center}
.mt{margin-top:18px}

.sem-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.semname{font-size:2.4rem;letter-spacing:.06em}
.semname.flip{animation:flipIn .6s ease backwards}
@keyframes flipIn{from{transform:rotateX(90deg);opacity:0}}
.steps{display:flex;gap:6px;align-items:center}
.steps i{width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;display:inline-block}
.steps i.on{background:var(--ink)}
.semdots{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.semdots i{width:12px;height:12px;border:2px solid var(--pencil);border-radius:3px;display:inline-block}
.semdots i.past{background:var(--pencil)}
.semdots i.now{background:var(--hl);border-color:var(--ink)}
.semdots i.over{border-color:var(--red);border-style:dashed}
.semdots i.over.past{background:var(--red)}
.goal{font-size:.95rem;margin-top:4px}

.committee{width:min(420px,100%);display:block;margin:6px auto 0}
.committee .line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bubble{position:relative;max-width:520px;margin:10px auto 0;background:var(--paper);border:2.5px solid var(--ink);border-radius:22px 18px 24px 16px;padding:12px 18px;font-size:1.25rem;font-weight:700;text-align:center}
.bubble::after{content:"";position:absolute;top:-14px;left:50%;border:12px solid transparent;border-bottom-color:var(--ink);border-top:0;transform:translateX(-50%)}
.score{display:flex;justify-content:center;gap:10px;margin-top:8px;font-size:1.4rem}

.cert{background:var(--paper);border:3px double var(--ink);outline:2px solid var(--ink);outline-offset:6px;padding:28px 26px;margin:14px auto 0;max-width:640px;text-align:center;position:relative}
.cert h2{font-size:clamp(2rem,6vw,2.8rem);margin:4px 0 8px}
.cert .ic{width:110px;height:110px}
.cert .story{font-size:1.12rem;max-width:30em;margin:8px auto}
.cert .stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:14px;font-size:.95rem;color:var(--pencil)}
.cert .stamp{position:absolute;right:18px;top:18px}
.care{margin-top:14px;font-size:.92rem;background:var(--n-green);display:inline-block;padding:6px 12px;transform:rotate(-1deg)}

@media (max-width:760px){
  #layout{grid-template-columns:minmax(0,1fr);gap:16px}
  #side{position:static;border-right:none;border-bottom:2px solid var(--margin);padding:0 0 10px;display:grid;grid-template-columns:86px minmax(0,1fr);gap:2px 12px;align-items:start}
  #side .char{max-width:86px}
  #side .who{grid-column:1;margin:0;font-size:.75rem;line-height:1.3}
  #side .stats{grid-column:2;grid-row:1 / span 2}
  #side .bar{font-size:.82rem;grid-template-columns:4.4em 1fr 2em}
  #side .counts{margin-top:6px}
  #side .attrs{margin-top:6px}
  #side .attrs b{font-size:1.15rem}
  #side .extra{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  #side .extra .side-sec{margin-top:4px}
  #side .extra h4{display:none}
  #side .relic{width:32px;height:32px}
  .cover{grid-template-columns:minmax(0,1fr)}
  .cover .char{max-width:180px}
  .semname{font-size:1.9rem}
  .page{padding:22px 16px 18px 56px}
  .page .pic{left:2px;width:34px}
  .page{background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 42px,transparent 42px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition:none !important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <header id="hud" hidden></header>
  <main id="layout" class="solo">
    <aside id="side" hidden></aside>
    <section id="stage" aria-live="polite"></section>
  </main>
</div>
<div id="modal" class="layer" hidden></div>
<div id="dice" class="layer" hidden></div>

<script>
/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]} return a; };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const wait = ms => new Promise(r=>setTimeout(r,ms));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tilt = () => (Math.random()*4-2).toFixed(1)+'deg';
const NOTE_COLORS = ['var(--n-yellow)','var(--n-pink)','var(--n-green)','var(--n-blue)','var(--n-orange)'];

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const META_KEY = 'gradRogue.meta.v1';
let META = Object.assign({scars:0,unlocked:[],endings:[],runs:0,equip:null,tut:false}, store.get(META_KEY,{}));
const saveMeta = () => store.set(META_KEY, META);

class EndGame { constructor(id){ this.id=id; } }

/* ================= doodle icons (64×64, stroke only) ================= */
const IC = {
  gpu:`<rect x="7" y="18" width="50" height="26" rx="3"/><circle cx="22" cy="31" r="8"/><circle cx="42" cy="31" r="8"/><path d="M22 23v16M14 31h16M42 23v16M34 31h16M13 44v7M20 44v7M27 44v7M34 44v7M41 44v7M48 44v7"/>`,
  rat:`<path d="M10 46Q8 28 27 26Q45 24 51 37L59 41L51 46Z"/><circle cx="43" cy="26" r="6"/><circle cx="51" cy="38" r="1.6" fill="currentColor"/><path d="M10 46Q1 52 6 59Q11 63 17 58M23 46v5M39 46v5M59 41l4-2M59 42l4 1"/>`,

let S = null;
const has = id => S.relics.includes(id);
const perk = id => S && S.perk === id;
const statVal = k => k==='favor' ? Math.floor(S.favor/10) : S.st[k];
const luckMod = () => Math.floor((S.st.luck-6)/2);
const ouch = v => perk('thick') ? Math.round(v/2) : v;

function newState(){
  return {field:null,school:null,prof:null,st:{skill:5,stamina:5,talk:5,luck:5},
    san:80,favor:50,prog:0,money:5,papers:0,stage:'ms',sem:0,total:0,
    relics:[],perk:META.equip && META.unlocked.includes(META.equip) ? META.equip : null,
    qual:false,qualFail:0,seen:{},warned:false};
}

function progMult(){
  let m = S.school.growth * S.prof.prog;
  if(has('code')||has('hela')) m *= 1.2;
  if(S.stage==='ms') m *= 1.15;
  if(S.stage==='phd') m *= .6;
  return m;
}
function sanMult(){
  let m = Math.max(.55, 1 - (S.st.stamina-6)*.05);
  if(has('phones')) m *= .8;
  return m;
}

/* apply a bundle of changes, return [[key,value],…] that actually applied */
function gain(d){
  const out=[];
  for(const k in d){
    let v=d[k]; if(!v) continue;
    if(k==='prog' && v>0) v=Math.max(1,Math.round(v*progMult()));
    if(k==='san' && v<0) v=Math.min(-1,Math.round(v*sanMult()));
    if(k in S.st){ S.st[k]=Math.max(1,S.st[k]+v); }
    else if(k==='san'||k==='favor'){ const b=S[k]; S[k]=clamp(S[k]+v,0,100); v=S[k]-b; }
    else if(k==='prog'){ const b=S.prog; S.prog=clamp(S.prog+v,0,100); v=S.prog-b; }
    else S[k]+=v;
    if(v) out.push([k,v]);
  }
  if(S.stage==='pd' && S.prog>=100){ S.prog=0; S.papers++; out.push(['papers',1]); }
  refresh(out.map(o=>o[0]));
  return out;
}
function checkFail(){
  if(S.san<=0) throw new EndGame('beach');
  if(S.money<0) throw new EndGame('boba');
  if(S.favor<=0) throw new EndGame('kicked');
}

    bs.forEach(b=>b.onclick=()=>{ m.hidden=true; res(+b.dataset.i); });

}
function deltaHTML(ds){
  if(!ds||!ds.length) return '';
  return `<div class="deltas">${ds.map(([k,v])=>{
    const good = (k==='san'||k==='prog'||k==='money'||k==='favor'||k==='papers'||k in STATN) ? v>0 : v<0;
    return `<span class="delta ${good?'up':'down'}">${DELTAN[k]} ${v>0?'+':'−'}${Math.abs(v)}${k==='money'?' 萬':''}</span>`;
  }).join('')}</div>`;
}
function note(title, text, ds, pic){

}

/* d20 roll with full breakdown */
function d20svg(n){
  return `<svg class="d20" viewBox="0 0 120 120"><polygon points="60,5 108,32 108,88 60,115 12,88 12,32"/><polygon class="inner" points="60,28 88,76 32,76"/><path d="M60 5L60 28M108 32L88 76M12 32L32 76M60 115L88 76M60 115L32 76M12 88L32 76M108 88L88 76M12 32L60 28M108 32L60 28" fill="none"/><text x="60" y="62" text-anchor="middle" dominant-baseline="middle">${n}</text></svg>`;
}
async function roll(stat, dc, label, extra=[]){
  const mods=[];
  if(stat) mods.push([STATN[stat], statVal(stat)]);
  if(stat!=='luck'){ const lm=luckMod(); if(lm) mods.push(['運氣',lm]); }
  if(has('charm')) mods.push(['御守',1]);
  extra.forEach(e=>{ if(e[1]) mods.push(e); });
  const mod=mods.reduce((a,b)=>a+b[1],0);
  const need=clamp(dc-mod,2,20);
  const L=$('#dice');
  L.innerHTML=`<div class="box"><div class="label">${label}</div>${d20svg('?')}
    <div class="mods">${mods.map(m=>`${m[0]} ${m[1]>=0?'+':''}${m[1]}`).join('　')}</div>
    <div class="need">需要擲出 ≥ <b class="num">${need}</b></div><div class="res" style="min-height:3.2rem"></div><div class="tap">點一下繼續</div></div>`;
  L.hidden=false;
  const svg=L.querySelector('.d20'), t=svg.querySelector('text');
  svg.classList.add('spin');
  const n=rnd(1,20);
  if(!REDUCED){ for(let i=0;i<9;i++){ t.textContent=rnd(1,20); await wait(90); } }
  t.textContent=n;
  const ok = n===20 || (n!==1 && n+mod>=dc);
  const txt = n===20?'大成功！':n===1?'大失敗…':ok?'成功':'失敗';
  L.querySelector('.res').innerHTML=`<span class="stamp ${ok?'good':''}">${txt}</span>`;
  await new Promise(r=>{ const t1=setTimeout(r,1700); L.onclick=()=>{clearTimeout(t1);r();}; });
  L.onclick=null; L.hidden=true;
  return {ok,n,crit:n===20,fumble:n===1};
}

function charSVG(o){
  const san=o.san??80, stage=o.stage||'ug', cups=o.cups||0;
  const HN=13, hair=Math.round(san/100*HN);
  let strands='';
  for(let i=0;i<HN;i++){
    if(i>=hair) continue;
    const a=(-68+i*(136/(HN-1)))*Math.PI/180;
    const x=90+40*Math.sin(a), y=74-40*Math.cos(a);
    const x2=90+56*Math.sin(a+.12), y2=74-56*Math.cos(a+.12);
    const cx=90+52*Math.sin(a-.18), cy=74-52*Math.cos(a-.18);
    strands+=`<path class="line" d="M${x.toFixed(1)} ${y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
  }
  let fallen='';
  for(let i=0;i<HN-hair;i++){
    const fx=22+((i*37)%70)+(i%2?78:0), fy=182+(i%3)*2;
    fallen+=`<path class="line" style="stroke-width:2" d="M${fx} ${fy}q4 -6 8 -2t8 -1"/>`;
  }
  const body = stage==='phd' ? '#fbfcf8' : stage==='pd' ? '#c7cfdd' : stage==='ms' ? '#ffd4dd' : '#d2e3ff';
  let clothes=`<path class="line" style="fill:${body}" d="M28 190q6-58 62-60q56 2 62 60z"/>`;
  if(stage==='phd') clothes+=`<path class="line" d="M90 132v58M78 134l12 22l12-22M70 160h10"/>`;
  else if(stage==='pd') clothes+=`<path class="line" d="M80 134l10 10l10-10M90 144l-5 20l5 8l5-8z"/>`;
  else if(stage==='ms') clothes+=`<path class="line" d="M70 134q20 22 40 0M84 150v14M96 150v14"/>`;
  else clothes+=`<text x="90" y="172" text-anchor="middle" style="font:700 15px var(--hand);fill:var(--ink)">畢業快樂</text>`;
  let eyes, mouth;
  if(san>65){ eyes=`<path class="line" d="M68 80q6-8 12 0M100 80q6-8 12 0"/>`; mouth=`<path class="line" d="M76 100q14 13 28 0"/>`; }
  else if(san>35){ eyes=`<circle cx="74" cy="79" r="3.4" fill="#1f2d4a"/><circle cx="106" cy="79" r="3.4" fill="#1f2d4a"/>`; mouth=`<path class="line" d="M80 104h20"/>`; }
  else { eyes=`<path class="line" d="M74 79m-5 0a5 5 0 1 0 5-5a3 3 0 1 0 2 4M106 79m-5 0a5 5 0 1 0 5-5a3 3 0 1 0 2 4"/>`; mouth=`<path class="line" d="M74 106q4-5 8 0t8 0t8 0t8 0"/>`; }
  const bag=(1-san/100)*.95;
  const bags=`<path d="M66 88q8 5 16 0M98 88q8 5 16 0" fill="none" stroke="#7b5aa6" stroke-width="3" stroke-linecap="round" opacity="${bag.toFixed(2)}"/>`;
  const sweat= san<45 ? `<path d="M128 70q6 10 0 14q-6-4 0-14z" fill="#d2e3ff" stroke="#1f2d4a" stroke-width="2"/>` : '';
  const stub = stage==='pd' ? `<path d="M80 114l1 2M88 116l1 2M96 116l1 2M104 114l1 2" class="line" style="stroke-width:2"/>` : '';
  const cap = (stage==='phd'||stage==='pd') ? `<g transform="rotate(-8 90 40)"><path class="line" style="fill:#1f2d4a" d="M48 40L90 22l42 18l-42 16z"/><path class="line" d="M128 42v20"/><circle cx="128" cy="64" r="3" fill="#ffe45c" stroke="#1f2d4a" stroke-width="2"/></g>` : '';
  let cupS='';
  for(let i=0;i<Math.min(cups,7);i++){
    const y=176-i*13, x=162+(i%2?2:-2);
    cupS+=`<path class="line" style="fill:#fbfcf8;stroke-width:2.2" d="M${x-8} ${y-11}h16l-2 12h-12z"/>`;
  }
  return `<svg class="char" viewBox="0 0 190 196" aria-hidden="true" style="filter:url(#rough)">
    ${fallen}${clothes}
    <circle cx="90" cy="76" r="40" fill="#fff6ea" class="line"/>
    ${strands}${eyes}${bags}${mouth}${sweat}${stub}
    <path class="line" style="stroke-width:2.4" d="M60 96q3 2 6 0M114 96q3 2 6 0" opacity=".5"/>
    ${cap}${cupS}</svg>`;
}

async function rollStats(){

  while(true){
    const sum=Object.values(S.st).reduce((a,b)=>a+b,0);
    ui(`<div class="scene-h"><h2>大學畢業了！</h2><span class="muted">先擲骰決定你這個人</span></div>
      <div class="dice6">${['skill','stamina','talk','luck'].map((k,i)=>`<div class="d6"><div class="face roll" style="animation-delay:${i*.08}s">${S.st[k]}</div>

function admitPct(sc){
  if(sc.id==='D') return 100;
  return clamp(Math.round(sc.base + (S.st.skill+S.st.talk+S.st.luck-19)*3 + (perk('rec')?12:0)), 3, 95);
}
async function applySchools(){
  const picks=[];
  const draw=()=>{
    ui(`<div class="scene-h"><h2>推甄志願表</h2><span class="muted">依序點選，最多填三個。全部落榜也不用怕，最後一列保證收你。</span></div>
      <div class="form"><table>
        <thead><tr><th>志願</th><th>學校</th><th>校訓</th><th>錄取率</th><th>資源 / 壓力</th></tr></thead>
        <tbody>${SCHOOLS.map(sc=>{const i=picks.indexOf(sc.id);const fixed=sc.id==='D';
          return `<tr class="${fixed?'fixed':'row'}" data-v="${sc.id}"><td><span class="slot">${fixed?'保':i>=0?i+1:''}</span></td>
          <td class="tier">${sc.name}</td><td>${sc.motto}</td><td class="pct">${admitPct(sc)}%</td>
          <td>${'★'.repeat(5-'SABCD'.indexOf(sc.id))}${'☆'.repeat('SABCD'.indexOf(sc.id))} / ${'🔥'.repeat(sc.pressure)}</td></tr>`}).join('')}</tbody>
      </table></div>
      <div class="btns"><button class="btn ghost" id="clr">清除重填</button><button class="btn primary" id="go" ${picks.length?'':'disabled'}>送出志願，等放榜 →</button></div>`, true);
    document.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{
      const id=tr.dataset.v, i=picks.indexOf(id);
      if(i>=0) picks.splice(i,1); else if(picks.length<3) picks.push(id);
      draw();
    });
    $('#clr').onclick=()=>{ picks.length=0; draw(); };
  };
  draw();
  await new Promise(r=>{ const h=()=>{ if(!picks.length) return; r(); }; document.addEventListener('click',function f(e){ if(e.target.closest('#go')){ document.removeEventListener('click',f); h(); } }); });

  ui(`<div class="scene-h"><h2>放榜</h2><span class="muted">按 F5 的手在發抖</span></div><div class="results" id="res"></div><div class="btns" id="after"></div>`, true);
  const res=$('#res');
  let got=null;
  for(const id of picks){
    const sc=SCHOOLS.find(s=>s.id===id), p=admitPct(sc);
    const row=document.createElement('div'); row.className='resrow';
    row.innerHTML=`<span class="nm">${sc.name}</span><span class="muted">錄取率 ${p}%</span><span class="num roller">…</span><span class="out"></span>`;
    res.appendChild(row);
    const r=row.querySelector('.roller');
    const v=rnd(1,100);
    if(!REDUCED) for(let i=0;i<10;i++){ r.textContent=rnd(1,100); await wait(70); }
    r.textContent=`擲出 ${v}`;
    const ok=v<=p;
    row.querySelector('.out').innerHTML=`<span class="stamp ${ok?'good':''}">${ok?'錄取':'落榜'}</span>`;
    await wait(650);
    if(ok){ got=sc; break; }
  }
  if(!got){
    got=SCHOOLS[4];
    const row=document.createElement('div'); row.className='resrow';
    row.innerHTML=`<span class="nm">${got.name}</span><span class="muted">備取最後一名…</span><span class="out"><span class="stamp good">遞補上了！</span></span>`;
    res.appendChild(row); await wait(600);
  }
  S.school=got;
  $('#after').innerHTML=`<p style="width:100%">恭喜考上 <b class="hl">${got.name}</b>！${got.id==='S'?'全家族都在群組轉發了。':got.id==='D'?'山上空氣很好，聽說猴子會搶便當。':'至少有學校念了。'}</p><button class="btn primary" data-v="ok">去找指導教授 →</button>`;
  await clickOnce($('#after'),'.btn');
}

async function relicPick(heading){
  const pool=shuffle(RELICS.filter(r=>!has(r.id) && (!r.field||r.field===S.field))).slice(0,3);
  if(!pool.length) return note(heading,'空的。看來前人已經把好東西都拿走了。',[]);
  const i=await modal(`<h2>${heading}</h2><p class="muted">選一個帶走</p>`, pool.map(r=>`${icon(r.icon,'sm')} <span><b>${r.name}</b><br><small class="muted">${r.desc}</small></span>`), true, 'cap');
  const r=pool[i]; S.relics.push(r.id); r.get && r.get(); refresh(['relics']);
}

/* ================= semester loop ================= */
function semDots(){
  const max={ms:6,phd:14,pd:6}[S.stage], norm={ms:4,phd:8,pd:6}[S.stage];
  let s='';
  for(let i=1;i<=max;i++) s+=`<i class="${i>norm?'over':''} ${i<S.sem?'past':i===S.sem?'now':''}" title="${i>norm?'延畢區':''}"></i>`;
  return `<div class="semdots" aria-label="第 ${S.sem} 學期，共 ${max} 學期">${s}</div>`;
}
function goalText(){
  if(S.stage==='ms') return `目標：學位進度 100 → 碩士口試（碩二下前完成，最晚碩三下）`;
  if(S.stage==='phd') return !S.qual ? `目標：博二下要考資格考・畢業需要進度 100 且論文 ≥ 2 篇` : `目標：進度 100、論文 ≥ 2 篇 → 博士口試（最晚博七下）`;
  return `目標：累積論文，投教職。草稿進度滿 100 自動變成一篇論文。`;
}
function drawCards(){
  const pool=ACTIONS.filter(a=>a.st.includes({ms:'M',phd:'P',pd:'D'}[S.stage]) && (!a.fd||a.fd===S.field) && a.w>0);
  const out=[];
  if(S.stage==='pd') out.push(ACTIONS.find(a=>a.id==='job'));
  const bag=[...pool];
  while(out.length<3 && bag.length){
    const tot=bag.reduce((s,a)=>s+a.w,0); let x=Math.random()*tot;
    const i=bag.findIndex(a=>(x-=a.w)<0);
    out.push(bag.splice(i<0?0:i,1)[0]);
  }
  return shuffle(out);
}
const val = v => typeof v==='function' ? v() : v;

async function playAction(step){
  const cards=drawCards();
  ui(`<div class="sem-head"><h2 class="semname ${step===0?'flip':''}">${semName()}</h2>
      <span class="steps">行動 ${[0,1].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</span></div>
    ${semDots()}<p class="goal muted">${goalText()}</p>
    <div class="cards">${cards.map((a,i)=>`<button class="note" data-i="${i}" style="--r:${tilt()};--c:${NOTE_COLORS[(i+step*2+S.total)%5]};--d:${i*.07}s">
      ${icon(a.ic)}<h3>${val(a.t)}</h3><span class="flav">${val(a.f)}</span>
      <span class="tags">${a.dice?`<span class="tag dice">🎲 ${a.dice}</span>`:''}${a.h.map(x=>`<span class="tag">${x}</span>`).join('')}</span></button>`).join('')}</div>`);
  const i=await clickOnce($('#stage'),'button.note');
  await cards[+i].run();
  checkFail();
}
async function randomEvent(){
  const stg={ms:'M',phd:'P',pd:'D'}[S.stage];
  let pool=EVENTS.filter(e=>(!e.fd||e.fd===S.field)&&(!e.pf||e.pf===S.prof.id)&&(!e.st||e.st.includes(stg))&&(!e.c||e.c()));
  const fresh=pool.filter(e=>!S.seen[e.id]);
  if(fresh.length) pool=fresh;
  const tot=pool.reduce((s,e)=>s+(e.rare?.6:e.pf?3:2),0); let x=Math.random()*tot;
  const ev=pool.find(e=>(x-=(e.rare?.6:e.pf?3:2))<0)||pool[0];
  S.seen[ev.id]=1;
  const i=await modal(`<p class="muted">突發事件</p><h2>${ev.t}</h2><p>${val(ev.x)}</p>`, ev.o.map(o=>o[0]), ev.o.length>1, ev.ic);
  await ev.o[i][1]();
  checkFail();
}
async function semesterEnd(){
  const pd=S.stage==='pd';
  const cost=pd?3:2, inc=(pd?5:S.prof.stipend)+(has('grant')?1:0);
  const regen=(has('coffee')?4:0)+(has('chair')?3:0)+(has('cat')?5:0);

  const ds=gain({money:inc-cost, san:regen-press, favor:-S.prof.decay});
  await note(`${semName()} 結束`, `生活費 −${cost} 萬，${pd?'薪水':'助學金'} +${inc} 萬。${S.school.name}的壓力加上${S.prof.name}教授的關愛，精神${press-regen>0?'又被磨掉一些':'居然恢復了'}。`, ds, 'hourglass');
  checkFail();
}

/* ================= milestones ================= */
async function milestones(){
  if(S.stage==='ms'){
    if(S.prog>=100 && S.sem>=3){
      const ok=await boss('ms');
      if(!ok){ await note('口試沒過','委員要求大修，你得延畢一學期。',gain({prog:-20,san:-10})); checkFail(); }
      else {
        await relicPick('畢業禮物');
        const c=await modal(`<h2>碩士畢業了！</h2><p>接下來呢？</p>`, ['繼續讀博士（同一位教授）','讀博士，但換一位教授（重新轉蛋）','去竹科上班'], true, 'cap');
        if(c===2) throw new EndGame('tsmc');
        if(c===1) await gacha(true);
        S.stage='phd'; S.sem=0; S.prog=0; renderHud(); refresh();
        return;
      }
    }
    if(S.sem===4 && !S.warned){ S.warned=true; await note('延畢了','你正式成為碩三生。學弟妹開始用敬語跟你說話。',gain({san:-5}),'hourglass'); checkFail(); }
    if(S.sem>=6) throw new EndGame('chicken');
  }
  else if(S.stage==='phd'){
    if(!S.qual && S.sem>=4){
      const ok=await boss('qual');
      if(ok) S.qual=true;
      else { S.qualFail++; if(S.qualFail>=2) throw new EndGame('qualfail'); await note('資格考沒過','還有一次機會，下學期再考。',gain({san:-10}),'question'); checkFail(); }
    }
    if(S.qual && S.prog>=100 && S.sem>=6){
      if(S.papers<2){ if(!S.paperWarn){ S.paperWarn=true; await note('論文不夠','學位進度滿了，但畢業門檻是兩篇論文。快去投稿！',[],'paper'); } }
      else {
        const ok=await boss('phd');
        if(!ok){ await note('口試沒過','委員要求再補一章，延畢一學期。',gain({prog:-20,san:-10})); checkFail(); }
        else {
          await relicPick('博士畢業禮物');
          const c=await modal(`<h2>你是博士了！</h2><p>名片上終於可以印 Ph.D.。接下來呢？</p>`, ['去當博士後研究員，挑戰教職','去業界'], true, 'cap');
          if(c===1) throw new EndGame('drind');
          S.stage='pd'; S.sem=0; S.prog=0; renderHud(); refresh();
          return;
        }
      }
    }
    if(S.sem>=14) throw new EndGame('seven');
  }
  else if(S.stage==='pd'){
    if(S.sem>=6) throw new EndGame('cafe');
  }
}

async function play(){
  renderHud(); refresh();
  if(S.perk==='legacy') await relicPick('學長的遺產');
  if(!META.tut){ META.tut=true; saveMeta(); await modal(`<h2>開學了！</h2><p>每學期選 <b class="hl">兩張卡</b>，之後可能會有突發事件。</p><p>左邊的小人就是你：頭髮越少，精神越差。<b>精神、存款、教授好感</b>任何一個歸零，人生就提早結束。</p>`,['我準備好了'],false,'cap'); }
  while(true){
    S.sem++; S.total++;
    refresh();
    for(let step=0;step<2;step++) await playAction(step);
    if(Math.random()<.6) await randomEvent();
    await semesterEnd();
    await milestones();
  }
}

  $('#side').hidden=true;
  ui(`<div class="cert">
      <span class="stamp ${e.good?'good':''}">${e.good?'恭喜':'結局'}</span>
      <p class="muted">${S.school?S.school.name:''}・${S.field?FIELDS[S.field].name:''}　結局 ${END_ORDER.indexOf(id)+1} / ${END_ORDER.length}${first?'　<b class="hl">新結局！</b>':''}</p>
      ${icon(e.ic)}
      <h2>${e.t}</h2>
      <p class="story">${story}</p>
      <div class="stats"><span>撐了 ${S.total} 個學期</span><span>論文 ${S.papers} 篇</span><span>指導教授：${S.prof?S.prof.name:'—'}</span><span>道具 ${S.relics.length} 個</span></div>
      <p class="mt">獲得學術傷疤 <b class="num">+${earned}</b>（共 ${META.scars}）</p>
      ${e.care?'<p class="care">遊戲外的小提醒：真的撐不住的時候，找人聊聊。台灣安心專線 1925。</p>':''}
    </div>
    <div class="btns" style="justify-content:center"><button class="btn primary" id="again">再投胎一次</button><button class="btn" id="back">回到封面</button></div>`, true);
  $('#again').onclick=()=>run();
  $('#back').onclick=()=>title();
}

async function run(){
  S=newState();
  $('#hud').hidden=true; $('#side').hidden=true;
  try{
    await rollStats();
    await chooseField();
    await applySchools();
    await gacha();
    await play();
  }catch(e){
    if(e instanceof EndGame){ $('#modal').hidden=true; $('#dice').hidden=true; await ending(e.id); }
    else { console.error(e); throw e; }
  }
}

title();
</script>
